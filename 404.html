<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    window.onload = () => {
      const path = window.location.pathname;
      const parts = path.split('/');
      const code = parts[parts.length - 1];

      // Allow 8+ alphanumeric characters for codes (normal or admin secret)
      const isLikelyCode = /^[A-Za-z0-9]{8,}$/.test(code);

      if (isLikelyCode) {
        window.location.href = `https://filebackend-production.up.railway.app/retrieve/${code}`;
      } else {
        window.location.href = 'https://datatesthub.com/';
      }
    };
  </script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 5em 1em;
    }
  </style>
</head>
<body>
  <h2>⏳ Redirecting...</h2>
</body>
</html>
