<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    window.onload = () => {
      const parts = location.pathname.split('/').filter(Boolean);
      // match /fileshare/retrieve/<code>
      if (parts.length === 3 && parts[0] === 'fileshare' && parts[1] === 'retrieve') {
        const code = parts[2];
        if (/^[A-Za-z0-9]{8,}$/.test(code)) {
          location.replace(`/fileshare/retrieve.html?code=${encodeURIComponent(code)}`);
          return;
        }
      }
      // otherwise go home
      location.replace('/');
    };
  </script>
</head>
<body>
  <p>Redirecting…</p>
</body>
</html>
