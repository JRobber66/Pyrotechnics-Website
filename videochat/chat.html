<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Chat Debug</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial; text-align: center; background-color: #f0f0f0; padding: 20px; }
        video { width: 45%; margin: 10px; background-color: black; }
        input, button { font-size: 1rem; padding: 10px; margin: 10px; width: 90%; max-width: 300px; }
    </style>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

<h1>Video Chat Debug Mode</h1>

<button onclick="createSession()">Create Session</button>
<p id="sessionTokenDisplay"></p>

<input type="text" id="joinToken" placeholder="Enter Session Token">
<button onclick="joinSession()">Join Session</button>

<video id="localVideo" autoplay muted playsinline></video>
<video id="remoteVideo" autoplay playsinline></video>

<script>
let localStream;
let remoteStream;
let peerConnection;
let sessionToken = '';
let isCreator = false;

const socket = io('wss://web-production-59907.up.railway.app');
const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

socket.on('connect', () => console.log('[Socket.IO] Connected to signaling server.'));

socket.on('joined', data => {
    console.log('[Socket.IO] Joined session:', data.message);
    if (isCreator) {
        startConnection(true);
    } else {
        startConnection(false);
    }
});

socket.on('signal', async (message) => {
    console.log(`[Socket.IO] Signal received: ${message.type}`);

    if (message.type === 'offer') {
        console.log('[Joiner] Offer received.');
        await peerConnection.setRemoteDescription(new RTCSessionDescription(message));
        console.log('[Joiner] Offer applied.');
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        socket.emit('signal', { token: sessionToken, message: answer });
        console.log('[Joiner] Answer created and sent.');
    }

    if (message.type === 'answer') {
        console.log('[Creator] Answer received.');
        await peerConnection.setRemoteDescription(new RTCSessionDescription(message));
        console.log('[Creator] Answer applied.');
    }

    if (message.type === 'candidate') {
        await peerConnection.addIceCandidate(message);
        console.log('[WebRTC] ICE candidate added.');
    }
});

function createSession() {
    sessionToken = Math.random().toString(36).substr(2, 8).toUpperCase();
    isCreator = true;
    document.getElementById('sessionTokenDisplay').innerText = 'Session Token: ' + sessionToken;
    socket.emit('join', { token: sessionToken });
    console.log('[Session] Created session:', sessionToken);
}

function joinSession() {
    sessionToken = document.getElementById('joinToken').value.trim();
    if (!sessionToken) {
        alert('Invalid token.');
        return;
    }
    isCreator = false;
    document.getElementById('sessionTokenDisplay').innerText = 'Joined Session: ' + sessionToken;
    socket.emit('join', { token: sessionToken });
    console.log('[Session] Joining session:', sessionToken);
}

async function startConnection(isCaller) {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    document.getElementById('localVideo').srcObject = localStream;

    peerConnection = new RTCPeerConnection(config);

    localStream.getTracks().forEach(track => {
        peerConnection.addTrack(track, localStream);
    });

    peerConnection.ontrack = event => {
        if (!remoteStream) {
            remoteStream = new MediaStream();
            document.getElementById('remoteVideo').srcObject = remoteStream;
        }
        remoteStream.addTrack(event.track);
        console.log('[WebRTC] Remote track received.');
    };

    peerConnection.onicecandidate = event => {
        if (event.candidate) {
            socket.emit('signal', { token: sessionToken, message: { type: 'candidate', candidate: event.candidate } });
            console.log('[WebRTC] ICE candidate sent.');
        }
    };

    if (isCaller) {
        console.log('[Creator] Creating offer.');
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        socket.emit('signal', { token: sessionToken, message: offer });
        console.log('[Creator] Offer created and sent.');
    }
}
</script>

</body>
</html>
