<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataTestHub</title>
  <style>
    body { font-family: system-ui, Arial; margin:0; background:#f6f7f9; color:#222; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 36px 20px; }
    h1 { margin:0 0 18px; }
    .grid { display:grid; gap:12px; grid-template-columns: 1fr; }
    @media(min-width:600px){ .grid { grid-template-columns: 1fr 1fr; } }
    .tile { background:#fff; border:1px solid #e7e7e7; border-radius:12px; padding:18px; text-decoration:none; color:#1f3b6b; box-shadow:0 1px 6px rgba(0,0,0,0.05); }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>DataTestHub</h1>
    <div class="grid">
      <a class="tile" href="/ytlink/mainpage.html">YouTube Downloader</a>
      <a class="tile" href="/fileshare/upload.html">Secure File Upload</a>
      <a class="tile hidden" id="chatTile" href="/chat/chat.html">AI Assistant Chat</a>
    </div>
  </div>

  <script>
    function setCookie(n,v,days){ document.cookie = `${n}=${v}; max-age=${days*86400}; path=/`; }
    function getCookie(n){ return document.cookie.split('; ').find(r=>r.startsWith(n+'='))?.split('=')[1]; }

    const chatTile = document.getElementById('chatTile');
    if (getCookie('chatVisible') === 'true') chatTile.classList.remove('hidden');

    document.addEventListener('keydown', (e)=>{
      if (e.ctrlKey && e.altKey && e.code==='KeyC'){
        chatTile.classList.remove('hidden');
        setCookie('chatVisible','true',365);
      }
    });
  </script>
</body>
</html>
