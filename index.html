<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Ratify — Ban List</title>
  <style>
    :root{--pad:14px;--gap:12px;--radius:12px}
    *{box-sizing:border-box}
    body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial;margin:0;background:#fafafa;color:#111}
    header{position:sticky;top:0;background:#fff;border-bottom:1px solid #eee;z-index:10}
    header .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px var(--pad)}
    h1{margin:0;font-size:18px}
    .container{display:grid;grid-template-columns:1fr 320px;gap:var(--gap);max-width:1100px;margin:16px auto;padding:0 var(--pad)}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:var(--radius);padding:var(--pad);box-shadow:0 1px 2px rgba(0,0,0,.03)}
    label{display:block;margin-top:8px;font-size:13px;color:#444}
    input[type=text],input[type=password],select{width:100%;margin-top:6px;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font-size:16px}
    button{border:0;border-radius:12px;padding:12px 14px;font-size:16px;cursor:pointer}
    button.primary{background:#0b63d7;color:#fff}
    button.ghost{background:#f3f4f6}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    .stack{display:flex;flex-direction:column;gap:8px}
    .candidate{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px dashed #eee}
    .candidate:last-child{border-bottom:0}
    .meta{font-size:13px;color:#666;margin-top:6px}
    .status{font-size:12px;padding:4px 8px;border-radius:999px;background:#f1f5f9;margin-left:8px;text-transform:capitalize}
    .status.banned{background:#e6ffed;color:#0a7a28}
    .status.allowed{background:#eef2ff;color:#3340a0}
    .votes{font-size:12px;color:#333;margin-left:6px;white-space:nowrap}
    .pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#f8fafc;border:1px solid #e5e7eb;margin:4px 6px 0 0;font-size:14px}
    .small{font-size:13px;color:#555}
    @media(max-width:800px){
      .container{grid-template-columns:1fr}
      header .bar{flex-wrap:wrap}
      input,button{width:100%}
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <h1>Ratify — Ban List</h1>
      <div class="small" id="authState">Not logged in</div>
    </div>
  </header>

  <div class="container">
    <main>
      <div class="card" id="authCard">
        <div class="stack">
          <div>
            <label for="member-select">Member</label>
            <select id="member-select"></select>
          </div>
          <div>
            <label for="pin">4-digit PIN (MMDD)</label>
            <input id="pin" type="password" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="MMDD"/>
          </div>
          <div class="row">
            <button id="loginBtn" class="primary">Login</button>
            <button id="logoutBtn" class="ghost" style="display:none">Logout</button>
          </div>
          <div id="need2fa" style="display:none">
            <label for="secondary">Secondary code</label>
            <input id="secondary" type="text" placeholder="Secondary code"/>
            <div class="row">
              <button id="verify2" class="primary">Verify</button>
            </div>
          </div>
          <div id="authMessage" class="small">Use your 4-digit PIN. Daniel requires a secondary code.</div>
        </div>
      </div>

      <div class="card" id="add-card">
        <h2 style="margin:0 0 8px 0;font-size:18px;">Add a name to consider banning</h2>
        <div class="stack">
          <div>
            <label>First name</label>
            <input id="firstName" type="text" placeholder="First name"/>
          </div>
          <div>
            <label>Last initial</label>
            <input id="lastInitial" type="text" maxlength="1" placeholder="Initial"/>
          </div>
          <div>
            <label>Notes (optional)</label>
            <input id="notes" type="text" placeholder="Context (optional)"/>
          </div>
          <div class="row">
            <button id="addBtn" class="primary">Add</button>
            <button id="refreshBtn" class="ghost">Refresh list</button>
          </div>
          <div id="addMessage" class="small"></div>
        </div>
      </div>

      <div class="card">
        <h2 style="margin:0 0 10px 0;font-size:18px;">Current list</h2>
        <div id="listArea">Loading...</div>
        <div class="small">Pending first. Unanimous YES becomes Banned. Unanimous NO becomes Allowed 🕊️.</div>
      </div>
    </main>

    <aside>
      <div class="card">
        <h2 style="margin:0 0 8px 0;font-size:16px;">Confirmed ban list</h2>
        <div id="bannedList">—</div>
      </div>
      <div class="card" style="margin-top:12px;">
        <h2 style="margin:0 0 8px 0;font-size:16px;">Allowed list 🕊️</h2>
        <div id="allowedList">—</div>
      </div>
    </aside>
  </div>

  <script>
    const API = 'https://ratification-production.up.railway.app';

    async function api(path, opts) {
      const url = API.replace(/\/+$/,'') + path;
      const res = await fetch(url, Object.assign({ headers: { 'Content-Type': 'application/json' }}, opts || {}));
      const text = await res.text().catch(function(){ return ''; });
      if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText + ': ' + text.slice(0,200));
      const ct = res.headers.get('content-type') || '';
      return ct.includes('application/json') ? JSON.parse(text) : text;
    }

    function esc(s) {
      return (s || '').replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]); });
    }

    var logged = null;

    var memberSelect = document.getElementById('member-select');
    var pinInput = document.getElementById('pin');
    var loginBtn = document.getElementById('loginBtn');
    var logoutBtn = document.getElementById('logoutBtn');
    var authState = document.getElementById('authState');
    var authMessage = document.getElementById('authMessage');
    var need2fa = document.getElementById('need2fa');
    var secondaryInput = document.getElementById('secondary');
    var verify2 = document.getElementById('verify2');

    var listArea = document.getElementById('listArea');
    var bannedList = document.getElementById('bannedList');
    var allowedList = document.getElementById('allowedList');

    var addBtn = document.getElementById('addBtn');
    var refreshBtn = document.getElementById('refreshBtn');
    var addMessage = document.getElementById('addMessage');

    async function loadMembers() {
      try {
        var data = await api('/members');
        memberSelect.innerHTML = '';
        data.members.forEach(function(m){
          var o = document.createElement('option');
          o.value = m;
          o.textContent = m;
          memberSelect.appendChild(o);
        });
      } catch(e) {
        memberSelect.innerHTML = '<option>(error)</option>';
      }
    }

    function isAdmin() { return logged === 'Daniel'; }

    function renderSidebar(candidates) {
      var banned = candidates.filter(function(c){ return c.status === 'banned'; });
      var allowed = candidates.filter(function(c){ return c.status === 'allowed'; });
      bannedList.innerHTML = banned.length ? banned.map(function(c){ return '<span class="pill">'+esc(c.firstName)+' '+esc(c.lastInitial)+'.</span>'; }).join(' ') : '—';
      allowedList.innerHTML = allowed.length ? allowed.map(function(c){ return '<span class="pill">'+esc(c.firstName)+' '+esc(c.lastInitial)+'.</span>'; }).join(' ') : '—';
    }

    function sortForMain(cands) {
      var rank = { pending: 0, allowed: 1, banned: 2 };
      return cands.slice().sort(function(a,b){
        var r = (rank[a.status] || 99) - (rank[b.status] || 99);
        if (r !== 0) return r;
        return String(a.createdAt || '').localeCompare(String(b.createdAt || ''));
      });
    }

    async function loadCandidates() {
      try {
        var data = await api('/candidates');
        var candidates = data.candidates || [];
        renderSidebar(candidates);
        var sorted = sortForMain(candidates);
        if (!sorted.length) {
          listArea.innerHTML = '<div class="small">No names yet.</div>';
          return;
        }
        listArea.innerHTML = '';
        sorted.forEach(function(c){
          var wrap = document.createElement('div');
          wrap.className = 'candidate';

          var left = document.createElement('div');
          var title = document.createElement('div');
          title.innerHTML = '<strong>'+esc(c.firstName)+' '+esc(c.lastInitial)+'.</strong> <span class="status '+c.status+'">'+c.status+'</span>';
          var meta = document.createElement('div');
          meta.className = 'meta';
          meta.textContent = c.notes ? ('Notes: ' + c.notes) : 'No notes';
          left.appendChild(title);
          left.appendChild(meta);

          var right = document.createElement('div');
          right.style.display = 'flex';
          right.style.alignItems = 'center';
          right.style.gap = '8px';

          if (c.status === 'pending') {
            var yesBtn = document.createElement('button');
            yesBtn.className = 'ghost';
            yesBtn.textContent = 'Vote YES';
            yesBtn.onclick = function(){ castVote(c.id, true); };
            var noBtn = document.createElement('button');
            noBtn.className = 'ghost';
            noBtn.textContent = 'Vote NO';
            noBtn.onclick = function(){ castVote(c.id, false); };
            right.appendChild(yesBtn);
            right.appendChild(noBtn);
          }

          var v = c.votes || {};
          var yesCount = Object.values(v).filter(function(x){ return x === true; }).length;
          var noCount = Object.values(v).filter(function(x){ return x === false; }).length;
          var votes = document.createElement('div');
          votes.className = 'votes';
          votes.textContent = 'Votes: ' + Object.keys(v).length + '/' + c.totalMembers + ' (Yes:' + yesCount + ' No:' + noCount + ')';
          right.appendChild(votes);

          if (isAdmin()) {
            var adminRow = document.createElement('div');
            adminRow.className = 'row';
            var mk = function(text, fn){ var b = document.createElement('button'); b.className='ghost'; b.textContent=text; b.onclick=fn; return b; };
            adminRow.appendChild(mk('Reopen', function(){ adminAction(c.id, { action:'reopen' }); }));
            adminRow.appendChild(mk('Delete', function(){ if (confirm('Delete this person?')) adminAction(c.id, { action:'delete' }); }));
            adminRow.appendChild(mk('Instant Ban', function(){ adminAction(c.id, { action:'setStatus', status:'banned' }); }));
            adminRow.appendChild(mk('Instant Allow', function(){ adminAction(c.id, { action:'setStatus', status:'allowed' }); }));
            var rightWrap = document.createElement('div');
            rightWrap.className = 'stack';
            rightWrap.appendChild(right);
            rightWrap.appendChild(adminRow);
            wrap.appendChild(left);
            wrap.appendChild(rightWrap);
          } else {
            wrap.appendChild(left);
            wrap.appendChild(right);
          }

          listArea.appendChild(wrap);
        });
      } catch(e) {
        listArea.innerHTML = '<div style="color:#b00">Error loading list</div>';
      }
    }

    async function castVote(candidateId, vote) {
      if (!logged) {
        alert('Login first.');
        return;
      }
      try {
        await api('/vote', { method: 'POST', body: JSON.stringify({ candidateId: candidateId, memberName: logged, vote: vote }) });
        await loadCandidates();
      } catch(e) {
        alert('Vote failed');
      }
    }

    async function adminAction(id, body) {
      await api('/candidates/' + encodeURIComponent(id), { method: 'PATCH', body: JSON.stringify(body) });
      await loadCandidates();
    }

    loginBtn.addEventListener('click', async function(){
      var memberName = memberSelect.value;
      var pin = pinInput.value.trim();
      if (!memberName || pin.length !== 4) {
        authMessage.textContent = 'Select member and enter MMDD.';
        return;
      }
      try {
        var r = await api('/auth', { method: 'POST', body: JSON.stringify({ memberName: memberName, pin: pin }) });
        if (r.need2fa) {
          need2fa.style.display = 'block';
          authMessage.textContent = 'Secondary code required.';
        } else if (r.ok) {
          logged = memberName;
          authMessage.textContent = 'Logged in as ' + memberName;
          authState.textContent = 'Logged in: ' + memberName + (memberName === 'Daniel' ? ' (admin)' : '');
          loginBtn.style.display = 'none';
          logoutBtn.style.display = '';
          pinInput.value = '';
          await loadCandidates();
        } else {
          authMessage.textContent = 'Login failed';
        }
      } catch(e) {
        authMessage.textContent = 'Login failed';
      }
    });

    verify2.addEventListener('click', async function(){
      var memberName = memberSelect.value;
      var secondary = secondaryInput.value.trim();
      if (!memberName || !secondary) {
        authMessage.textContent = 'Enter secondary code.';
        return;
      }
      try {
        var r = await api('/auth/2', { method: 'POST', body: JSON.stringify({ memberName: memberName, secondary: secondary }) });
        if (r.ok) {
          logged = memberName;
          authMessage.textContent = 'Logged in as ' + memberName;
          authState.textContent = 'Logged in: ' + memberName + (memberName === 'Daniel' ? ' (admin)' : '');
          need2fa.style.display = 'none';
          loginBtn.style.display = 'none';
          logoutBtn.style.display = '';
          secondaryInput.value = '';
          await loadCandidates();
        } else {
          authMessage.textContent = 'Verification failed';
        }
      } catch(e) {
        authMessage.textContent = 'Verification failed';
      }
    });

    logoutBtn.addEventListener('click', async function(){
      logged = null;
      authMessage.textContent = 'Logged out';
      authState.textContent = 'Not logged in';
      loginBtn.style.display = '';
      logoutBtn.style.display = 'none';
      await loadCandidates();
    });

    addBtn.addEventListener('click', async function(){
      var first = document.getElementById('firstName').value.trim();
      var last = document.getElementById('lastInitial').value.trim();
      var notes = document.getElementById('notes').value.trim();
      addMessage.textContent = '';
      if (!first || !last) {
        addMessage.textContent = 'First name and last initial required.';
        return;
      }
      try {
        await api('/candidates', { method: 'POST', body: JSON.stringify({ firstName: first, lastInitial: last[0].toUpperCase(), notes: notes }) });
        addMessage.textContent = 'Added.';
        document.getElementById('firstName').value = '';
        document.getElementById('lastInitial').value = '';
        document.getElementById('notes').value = '';
        await loadCandidates();
      } catch(e) {
        addMessage.textContent = 'Error: ' + e.message;
      }
    });

    refreshBtn.addEventListener('click', loadCandidates);

    (async function init(){
      await loadMembers();
      await loadCandidates();
    })();
  </script>
</body>
</html>
