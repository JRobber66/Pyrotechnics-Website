<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YouTube Downloader</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; background-color: #f0f0f0; }
        input, select, button { font-size: 1rem; padding: 10px; width: 300px; margin: 10px 0; }
        img { max-width: 400px; display: block; margin: auto; }
        #status { margin-top: 15px; font-weight: bold; }
        progress { width: 80%; height: 20px; }
    </style>
</head>
<body>

    <h1>YouTube Downloader</h1>
    <input type="text" id="urlInput" oninput="handleInput()" placeholder="https://youtube.com/shorts/...">
    <br>

    <h3 id="videoTitle"></h3>
    <img id="thumbnailPreview" alt="" style="display:none;">
    <p id="filesizeDisplay"></p>

    <label for="qualitySelect">Choose Quality:</label><br>
    <select id="qualitySelect">
        <option value="1080p">1080p</option>
        <option value="720p">720p</option>
        <option value="480p">480p</option>
        <option value="audio">Audio Only</option>
    </select>
    <br>

    <button onclick="downloadVideo()">Download</button>
    <progress id="downloadProgress" value="0" max="100" style="display:none;"></progress>
    <div id="status"></div>

    <script>
        const apiKey = 'super_secret_key_123';
        const backendBase = 'https://backend-test-production-c240.up.railway.app/';

        function isValidYouTubeLink(url) {
            return url.startsWith('https://www.youtube.com/') ||
                   url.startsWith('https://youtube.com/') ||
                   url.startsWith('https://youtu.be/');
        }

        async function fetchVideoInfo(url) {
            const infoUrl = backendBase + 'info?url=' + encodeURIComponent(url) + '&key=' + apiKey;
            try {
                const response = await fetch(infoUrl);
                if (!response.ok) return null;
                return await response.json();
            } catch {
                return null;
            }
        }

        async function handleInput() {
            const url = document.getElementById('urlInput').value.trim();
            const titleDiv = document.getElementById('videoTitle');
            const thumbImg = document.getElementById('thumbnailPreview');
            const filesizeDiv = document.getElementById('filesizeDisplay');

            titleDiv.textContent = '';
            thumbImg.style.display = 'none';
            filesizeDiv.textContent = '';

            if (!isValidYouTubeLink(url)) return;

            const info = await fetchVideoInfo(url);

            if (info && info.title) {
                titleDiv.textContent = info.title;
                thumbImg.src = info.thumbnail;
                thumbImg.style.display = 'block';
                filesizeDiv.textContent = 'Approximate File Size: ' + Math.round(info.filesize / 1048576) + ' MB';
            }
        }

        async function downloadVideo() {
            const url = document.getElementById('urlInput').value.trim();
            const quality = document.getElementById('qualitySelect').value;
            const statusDiv = document.getElementById('status');
            const progressBar = document.getElementById('downloadProgress');

            if (!isValidYouTubeLink(url)) {
                statusDiv.textContent = '❌ Invalid YouTube URL.';
                return;
            }

            const taskID = Math.random().toString(36).substring(2, 10);

            statusDiv.textContent = 'Starting download...';
            progressBar.style.display = 'block';
            progressBar.value = 0;

            const poll = setInterval(async () => {
                const progressResponse = await fetch(backendBase + 'progress?task=' + taskID + '&key=' + apiKey);
                const progressData = await progressResponse.json();
                const percent = parseFloat(progressData.progress.replace('%','')) || 0;
                progressBar.value = percent;
            }, 1000);

            const requestURL = backendBase + 'download?url=' + encodeURIComponent(url) + '&quality=' + quality + '&key=' + apiKey + '&task=' + taskID;

            try {
                const response = await fetch(requestURL);
                clearInterval(poll);

                if (!response.ok) {
                    statusDiv.textContent = '❌ Download failed.';
                    return;
                }

                const blob = await response.blob();
                const downloadLink = document.createElement('a');
                downloadLink.href = URL.createObjectURL(blob);
                downloadLink.download = 'video.mp4';
                downloadLink.click();

                progressBar.style.display = 'none';
                statusDiv.textContent = '✅ Download complete!';
            } catch {
                clearInterval(poll);
                statusDiv.textContent = '❌ Error contacting backend.';
            }
        }
    </script>

</body>
</html>
