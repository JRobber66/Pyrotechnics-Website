<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YouTube Downloader</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f0f0f0; }
        input, select, button { font-size: 1rem; padding: 10px; width: 300px; margin: 10px 0; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>YouTube Downloader</h1>
    <p>Paste your YouTube link below:</p>

    <input type="text" id="urlInput" placeholder="https://youtube.com/shorts/...">
    <br>

    <label for="qualitySelect">Choose Quality:</label><br>
    <select id="qualitySelect">
        <option value="1080p">1080p</option>
        <option value="720p">720p</option>
        <option value="480p">480p</option>
        <option value="audio">Audio Only</option>
    </select>
    <br>

    <button onclick="downloadVideo()">Download</button>

    <div id="status"></div>

    <script>
        function isValidYouTubeLink(url) {
            return url.startsWith('https://www.youtube.com/') || url.startsWith('https://youtube.com/') || url.startsWith('https://youtu.be/');
        }

        async function downloadVideo() {
            const url = document.getElementById('urlInput').value.trim();
            const quality = document.getElementById('qualitySelect').value;
            const statusDiv = document.getElementById('status');

            const backendBase = 'https://backend-test-production-c240.up.railway.app/download?url=';

            if (!isValidYouTubeLink(url)) {
                statusDiv.textContent = '❌ Please enter a valid YouTube link.';
                return;
            }

            statusDiv.textContent = '⏳ Processing your request...';

            try {
                const requestURL = backendBase + encodeURIComponent(url) + '&quality=' + quality;
                const response = await fetch(requestURL);

                if (!response.ok) {
                    statusDiv.textContent = '❌ Failed to download video.';
                    return;
                }

                const blob = await response.blob();
                const downloadLink = document.createElement('a');
                downloadLink.href = URL.createObjectURL(blob);
                downloadLink.download = quality === 'audio' ? 'audio.m4a' : 'video.mp4';
                downloadLink.click();

                statusDiv.textContent = '✅ Download started!';
            } catch (error) {
                statusDiv.textContent = '❌ Error connecting to backend.';
            }
        }
    </script>

</body>
</html>
