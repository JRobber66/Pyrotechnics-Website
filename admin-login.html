<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; background-color: #f0f0f0; }
        input, button { font-size: 1rem; padding: 10px; width: 300px; margin: 10px 0; }
    </style>
</head>
<body>

    <h1>Admin Login</h1>
    <input type="text" id="usernameInput" placeholder="Username"><br>
    <input type="password" id="passwordInput" placeholder="Password"><br>
    <button onclick="submitLogin()">Login</button>
    <p id="loginStatus"></p>

    <script>
        async function submitLogin() {
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();

            const response = await fetch('/admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: password })
            });

            if (response.ok) {
                window.location.href = '/admin-panel';
            } else {
                document.getElementById('loginStatus').textContent = '❌ Invalid username or password.';
            }
        }
    </script>

</body>
</html>
