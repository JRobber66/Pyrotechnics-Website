<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure File Upload</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: system-ui, Arial; background:#f5f7fa; margin:0; }
    .wrap { max-width: 700px; margin: 0 auto; padding: 28px; }
    h1 { margin: 0 0 10px; }
    .card { background:#fff; border:1px solid #e7e7e7; border-radius:12px; padding:20px; box-shadow:0 1px 6px rgba(0,0,0,0.05); }
    .drop { border:2px dashed #1f7ae0; color:#1f7ae0; padding:30px; text-align:center; border-radius:12px; cursor:pointer; }
    .drop.dragover { background:#f0f7ff; }
    .row { margin-top:12px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    button, .btn { border:1px solid #ccc; background:#fafafa; padding:10px 14px; border-radius:8px; cursor:pointer; }
    .btn.primary, button.primary { background:#1f7ae0; color:#fff; border:none; }
    #progress { display:none; margin-top:14px; }
    .bar { height:10px; background:#e7e7e7; border-radius:999px; overflow:hidden; }
    .fill { height:100%; width:0; background:#1f7ae0; }
    .muted { color:#666; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Secure File Upload</h1>
    <div class="card">
      <div id="drop" class="drop">Click or drag file(s) here</div>
      <input id="pick" type="file" multiple style="display:none;" />
      <div class="row">
        <label><input type="checkbox" id="del"> Delete after download</label>
      </div>
      <div id="largeGate" class="row" style="display:none;">
        <input id="secret" placeholder="Enter secret code for ≥1GB uploads" />
      </div>
      <div class="row">
        <button class="primary" id="go">Upload</button>
        <a href="retrieve.html" class="btn">Go to Retrieval</a>
      </div>

      <div id="status" class="row muted"></div>

      <div id="progress">
        <div class="bar"><div class="fill" id="fill"></div></div>
        <div class="muted" id="eta" style="margin-top:6px;"></div>
      </div>

      <div id="done" class="row" style="display:none;">
        <div id="codeText" class="muted"></div>
        <button id="copyCode">Copy Code</button>
        <button id="copyLink">Copy Link</button>
      </div>
    </div>
  </div>

  <script>
    const BACKEND = 'https://filebackend-production.up.railway.app';
    const SECRET_CODE = 'f9JwZ7lXp2';

    const drop = document.getElementById('drop');
    const pick = document.getElementById('pick');
    const del = document.getElementById('del');
    const largeGate = document.getElementById('largeGate');
    const secret = document.getElementById('secret');

    const status = document.getElementById('status');
    const progress = document.getElementById('progress');
    const fill = document.getElementById('fill');
    const eta = document.getElementById('eta');

    const done = document.getElementById('done');
    const codeText = document.getElementById('codeText');

    let files = [];
    let total = 0;

    drop.addEventListener('click', () => pick.click());
    pick.addEventListener('change', e => handle(e.target.files));
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('dragover'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
    drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('dragover'); handle(e.dataTransfer.files); });

    function handle(list) {
      files = Array.from(list || []);
      total = files.reduce((s,f)=>s+f.size,0);
      drop.textContent = `${files.length} file(s) selected`;
      largeGate.style.display = total >= 1024*1024*1024 ? 'flex' : 'none';
    }

    document.getElementById('go').addEventListener('click', () => {
      if (!files.length) { status.textContent = 'No files selected.'; return; }
      if (total >= 1024*1024*1024 && secret.value.trim() !== SECRET_CODE) {
        status.textContent = 'Secret code required for ≥1GB uploads.'; return;
      }
      if (total > 50*1024*1024) uploadLarge(); else uploadSmall();
    });

    function uploadSmall() {
      status.textContent = 'Uploading…';
      done.style.display = 'none';
      const fd = new FormData();
      files.forEach(f=>fd.append('files', f));
      fd.append('delete_after', del.checked ? 'true' : 'false');
      fetch(`${BACKEND}/upload`, { method:'POST', body:fd })
        .then(r=>r.json()).then(showResult).catch(()=>status.textContent='Upload failed.');
    }

    function uploadLarge() {
      const fd = new FormData();
      files.forEach(f=>fd.append('files', f));
      fd.append('delete_after', del.checked ? 'true' : 'false');

      status.textContent = 'Uploading…';
      progress.style.display = 'block';
      fill.style.width = '0%'; eta.textContent = '';

      let start = Date.now();
      const xhr = new XMLHttpRequest();
      xhr.open('POST', `${BACKEND}/upload`);
      xhr.upload.onprogress = (e)=>{
        if (!e.lengthComputable) return;
        const pct = e.loaded/e.total*100;
        fill.style.width = pct.toFixed(2)+'%';
        const elapsed = (Date.now()-start)/1000;
        const speed = e.loaded/elapsed;
        const remain = e.total - e.loaded;
        eta.textContent = `ETA: ${Math.ceil(remain/speed)}s`;
      };
      xhr.onload = ()=>{
        progress.style.display='none';
        if (xhr.status===200) showResult(JSON.parse(xhr.responseText));
        else status.textContent='Upload failed.';
      };
      xhr.onerror = ()=>{
        progress.style.display='none';
        status.textContent='Upload failed.';
      };
      xhr.send(fd);
    }

    function showResult(data){
      status.textContent = 'Done!';
      done.style.display='flex';
      codeText.textContent = `Code: ${data.code}`;
      const link = `${location.origin}/fileshare/retrieve.html?code=${encodeURIComponent(data.code)}`;
      document.getElementById('copyCode').onclick = ()=>{ navigator.clipboard.writeText(data.code); alert('Code copied'); };
      document.getElementById('copyLink').onclick = ()=>{ navigator.clipboard.writeText(link); alert('Link copied'); };
    }
  </script>
</body>
</html>
